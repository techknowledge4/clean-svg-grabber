<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; width: 300px; padding: 12px; margin: 0; background: #f8f9fa; }
    h3 { margin: 0 0 10px 0; font-size: 15px; color: #1a1a1a; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 380px; overflow-y: auto; }
    .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; padding: 8px; text-align: center; }
    .preview { height: 45px; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
    .preview svg { max-width: 36px; max-height: 36px; }
    .btn-group { display: flex; gap: 4px; }
    button { flex: 1; padding: 4px 2px; font-size: 10px; font-weight: 600; cursor: pointer; border: 1px solid #0070f3; background: #0070f3; color: #fff; border-radius: 4px; }
    button.secondary { background: #fff; color: #0070f3; }
    .empty { color: #666; font-size: 12px; text-align: center; padding: 16px 0; grid-column: span 2; }
  </style>
</head>
<body>
  <h3>Clean SVG Grabber</h3>
  <div id="container" class="grid"></div>
  <script src="popup.js"></script>
</body>
</html>
